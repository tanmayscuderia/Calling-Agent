services:
  # API + WhatsApp bridge + inbound poller (no queue worker — see worker service)
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    environment:
      WORKER_IN_PROCESS: "false"
    restart: unless-stopped

  # Dedicated job-queue worker (polls job_queue; SKIP LOCKED makes it
  # safe to run alongside or scale to N replicas)
  worker:
    build: ./backend
    command: node dist/worker.js
    env_file:
      - ./.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder-anon-key}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped